function hex2rgb(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }

// per-player colored heat: intensity blobs colorized with the player color, blended with 'lighter'
function drawHeat(canvas, ptsByPlayer, region) {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const pts = Object.values(ptsByPlayer).flat();
  if (!pts.length) return;
  // single intensity field for all selected players
  const off = document.createElement('canvas'); off.width = off.height = 1024;
  const o = off.getContext('2d');
  for (const [x, y] of pts) {
    const g = o.createRadialGradient(x, y, 0, x, y, 15);
    g.addColorStop(0, 'rgba(0,0,0,0.09)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    o.fillStyle = g;
    o.fillRect(x - 15, y - 15, 30, 30);
  }
  const img = o.getImageData(0, 0, 1024, 1024);
  const out = o.createImageData(1024, 1024);
  // find peak intensity, normalize so only the true hotspot reaches 1
  let mx = 1;
  for (let i = 3; i < img.data.length; i += 4) mx = Math.max(mx, img.data[i]);
  for (let i = 0; i < img.data.length; i += 4) {
    const raw = Math.pow(img.data[i + 3] / mx, 2.6);
    // piecewise red ramp: dark red -> red -> orange only at the very peak
    out.data[i] = raw < 0.12 ? 0 : 170 + 85 * Math.min(1, raw * 1.4);
    out.data[i + 1] = raw < 0.75 ? 30 * raw : 30 * raw + 200 * (raw - 0.75);
    out.data[i + 2] = 25 * raw;
    out.data[i + 3] = raw < 0.12 ? 0 : 60 + 195 * raw;
  }
  o.putImageData(out, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  if (region) {
    // draw radar crop under the heat crop
    if (IMG_EL.complete) {
      ctx.drawImage(IMG_EL, region[0], region[1], region[2], region[3],
                    0, 0, canvas.width, canvas.height);
    }
    ctx.drawImage(off, region[0], region[1], region[2], region[3],
                  0, 0, canvas.width, canvas.height);
  } else {
    ctx.drawImage(off, 0, 0);
  }

  // top-5 hotspot labels with count + share (region-restricted for insets)
  let labelPts = pts;
  let toX = x => x, toY = y => y;
  if (region) {
    labelPts = pts.filter(([x, y]) => x >= region[0] && x <= region[0] + region[2] &&
                                     y >= region[1] && y <= region[1] + region[3]);
    const kx = canvas.width / region[2], ky = canvas.height / region[3];
    toX = x => (x - region[0]) * kx;
    toY = y => (y - region[1]) * ky;
  }
  const cells = {};
  for (const [x, y] of labelPts) {
    const k = Math.round(x / 34) + '_' + Math.round(y / 34);
    (cells[k] = cells[k] || { sx: 0, sy: 0, n: 0 });
    cells[k].sx += x; cells[k].sy += y; cells[k].n++;
  }
  const ranked = Object.values(cells).sort((a, b) => b.n - a.n);
  const picked = [];
  for (const c of ranked) {
    if (picked.length >= 5) break;
    const cx = toX(c.sx / c.n), cy = toY(c.sy / c.n);
    if (picked.some(p => Math.hypot(p.x - cx, p.y - cy) < 64)) continue;
    picked.push({ x: cx, y: cy, n: c.n });
  }
  ctx.font = 'bold 22px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  for (const p of picked) {
    const label = p.n + '次·' + Math.round(p.n / Math.max(1, labelPts.length) * 100) + '%';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(10,12,15,0.9)';
    ctx.strokeText(label, p.x, p.y - 14);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(label, p.x, p.y - 14);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 7, 0, 6.283);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  }
}

// ---- hero interactive map ----
const hero = { k: 1.55, tx: -114, ty: -199 };
const heroCv = document.getElementById('hero-cv');
const layers = { posCT: false, posT: false, he: true, fire: true, smoke: true, flash: true };
const UTIL_COLOR = { he: '#ffd54f', fire: '#ff7043', smoke: '#b0bec5', flash: '#4fc3f7' };

document.querySelectorAll('.lyr').forEach(cb =>
  cb.addEventListener('change', () => { layers[cb.dataset.l] = cb.checked; renderHero(); }));
document.getElementById('hero-reset').addEventListener('click', () => {
  hero.k = 1.55; hero.tx = -114; hero.ty = -199; renderHero();
});

let drag = null;
heroCv.addEventListener('mousedown', e => { drag = { x: e.clientX - hero.tx, y: e.clientY - hero.ty }; });
window.addEventListener('mousemove', e => {
  if (!drag) return;
  hero.tx = e.clientX - drag.x; hero.ty = e.clientY - drag.y; renderHero();
});
window.addEventListener('mouseup', () => { drag = null; });
heroCv.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = heroCv.getBoundingClientRect();
  const scale = heroCv.width / rect.width;
  const mx = (e.clientX - rect.left) * scale, my = (e.clientY - rect.top) * scale;
  const k2 = Math.min(14, Math.max(0.6, hero.k * (e.deltaY < 0 ? 1.15 : 0.87)));
  hero.tx = mx - (mx - hero.tx) * (k2 / hero.k);
  hero.ty = my - (my - hero.ty) * (k2 / hero.k);
  hero.k = k2;
  renderHero();
}, { passive: false });

function phasePos(side) {
  const out = {};
  for (const p of DATA.players) {
    let pts = [];
    for (const ph of ['early', 'mid', 'late']) {
      if (state.phase === 'all' || state.phase === ph) {
        pts = pts.concat((DATA.pos[side][ph] || {})[p] || []);
      }
    }
    out[p] = pts;
  }
  return out;
}

function renderHero() {
  const ctx = heroCv.getContext('2d');
  ctx.clearRect(0, 0, heroCv.width, heroCv.height);
  ctx.save();
  ctx.translate(hero.tx, hero.ty);
  ctx.scale(hero.k, hero.k);
  if (IMG_EL.complete) ctx.drawImage(IMG_EL, 0, 0);
  const dotR = 3.5 / hero.k, markR = 5.5 / hero.k;
  // position layers
  for (const [layerKey, side] of [['posCT', 'ct'], ['posT', 't']]) {
    if (!layers[layerKey]) continue;
    const byP = phasePos(side);
    for (const p of state.players) {
      ctx.fillStyle = DATA.colors[p];
      ctx.globalAlpha = 0.5;
      for (const [x, y] of byP[p] || []) {
        ctx.beginPath(); ctx.arc(x, y, dotR, 0, 6.283); ctx.fill();
      }
    }
  }
  ctx.globalAlpha = 1;
  // utility layers
  for (const e of DATA.util) {
    if (!layers[e.u]) continue;
    if (!state.players.has(e.p)) continue;
    if (state.side !== 'all' && e.s !== state.side) continue;
    if (state.phase !== 'all' && e.ph !== state.phase) continue;
    ctx.beginPath();
    ctx.arc(e.x, e.y, markR, 0, 6.283);
    ctx.fillStyle = UTIL_COLOR[e.u];
    ctx.fill();
    ctx.lineWidth = 1.4 / hero.k;
    ctx.strokeStyle = DATA.colors[e.p];
    ctx.stroke();
  }
  ctx.restore();
}

function renderAll() {
  // positions: phase selector picks the sampling window (all = merged)
  for (const side of ['ct', 't']) {
    const byPlayer = {};
    let total = 0;
    for (const p of state.players) {
      let pts = [];
      for (const ph of ['early', 'mid', 'late']) {
        if (state.phase === 'all' || state.phase === ph) {
          pts = pts.concat((DATA.pos[side][ph] || {})[p] || []);
        }
      }
      byPlayer[p] = pts; total += pts.length;
    }
    document.getElementById('sub-' + side).textContent = `${PHASE_LABEL[state.phase]} · ${total} 个存活采样点`;
    drawHeat(document.getElementById('cv-' + side), byPlayer);
  }
  // zoom insets: raw landing dots, cropped to the region
  for (const [id, subId, region] of ZOOMS) {
    const canvas = document.getElementById(id);
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (IMG_EL.complete) {
      ctx.drawImage(IMG_EL, region[0], region[1], region[2], region[3],
                    0, 0, canvas.width, canvas.height);
    }
    const kx = canvas.width / region[2], ky = canvas.height / region[3];
    let n = 0;
    for (const e of DATA.util) {
      if (!state.players.has(e.p)) continue;
      if (state.side !== 'all' && e.s !== state.side) continue;
      if (state.phase !== 'all' && e.ph !== state.phase) continue;
      if (state.utype !== 'all' && e.u !== state.utype) continue;
      if (e.x < region[0] || e.x > region[0] + region[2] ||
          e.y < region[1] || e.y > region[1] + region[3]) continue;
      const x = (e.x - region[0]) * kx, y = (e.y - region[1]) * ky;
      ctx.beginPath();
      ctx.arc(x, y, 9, 0, 6.283);
      ctx.fillStyle = DATA.colors[e.p];
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = e.s === 'ct' ? '#ffffff' : '#0c0e11';
      ctx.stroke();
      n++;
    }
    const utl = { all: '全部道具', he: '雷', fire: '火', smoke: '烟', flash: '闪' }[state.utype];
    document.getElementById(subId).textContent = `放大 · ${utl} · ${n} 个落点（白边=CT 黑边=T，点颜色=玩家）`;
  }

  // utility per type
  for (const u of ['he', 'fire', 'smoke', 'flash']) {
    const byPlayer = {};
    let total = 0;
    for (const p of state.players) byPlayer[p] = [];
    for (const e of DATA.util) {
      if (e.u !== u) continue;
      if (!state.players.has(e.p)) continue;
      if (state.side !== 'all' && e.s !== state.side) continue;
      if (state.phase !== 'all' && e.ph !== state.phase) continue;
      byPlayer[e.p].push([e.x, e.y]); total++;
    }
    document.getElementById('sub-' + u).textContent = `${PHASE_LABEL[state.phase]} · ${total} 次`;
    drawHeat(document.getElementById('cv-' + u), byPlayer);
  }
  renderHero();
}
renderAll();
</script>
</body></html>
